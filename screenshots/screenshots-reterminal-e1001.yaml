# Renders the reTerminal E1001 display off-device and saves the README/site
# screenshots - no hardware or Home Assistant needed:
#
#   esphome run screenshots/screenshots-reterminal-e1001.yaml
#
# Runs on the host platform with the snapshot display: the same render
# lambda as the real device (common/) and the reTerminal E1001's font preset
# (reterminal-e1001/fonts.yaml) draw a set of demo events (plus an offline-state
# view), one BMP per view is written to
# .esphome/snapshots/pc-screenshots-reterminal/ (override with the
# ESPHOME_SNAPSHOT_DIR environment variable), and the binary exits.
# snapshot.take never overwrites an existing file (it logs an error and
# skips it), so delete the old BMPs before re-running.
# Convert the BMPs to PNG and put them in static/screenshots/.
#
# This config is a development tool: it is not built by CI (only
# *.factory.yaml files are) and is not meant to be installed anywhere.

# The view button's name in the footer hint, as on the reTerminal
substitutions:
  view_button: green

esphome:
  name: pc-screenshots-reterminal
  min_version: 2026.9.1
  on_boot:
    # After the demo state is seeded (common.yaml, priority -100)
    - priority: -200
      then:
        # Day view
        - lambda: "id(view_days) = 1;"
        - component.update: epaper
        - snapshot.take:
            id: epaper
            filename: day-view.bmp
        # 3-day view, with room humidity too
        - lambda: "id(view_days) = 3;"
        - select.set:
            id: climate_display_mode
            option: Temperature and humidity
        - component.update: epaper
        - snapshot.take:
            id: epaper
            filename: three-day-view.bmp
        # Offline: the last fetch failed, so the header shows the inverted
        # OFFLINE note with the age of the data (2.5 hours here)
        - lambda: |-
            id(data_state) = 2;
            id(fetched_at) = id(ha_time).now().timestamp - 9000;
            id(view_days) = 1;
        - component.update: epaper
        - snapshot.take:
            id: epaper
            filename: offline-view.bmp
        - lambda: |-
            id(data_state) = 1;
            id(fetched_at) = id(ha_time).now().timestamp;
        # Wi-Fi setup screen (shown while no Wi-Fi credentials are saved)
        - lambda: |-
            id(calendar_ids).publish_state("");
            id(wifi_setup) = true;
            id(wifi_qr).set_value("WIFI:T:nopass;S:" + id(ap_ssid) + ";;");
        - component.update: epaper
        - snapshot.take:
            id: epaper
            filename: wifi-setup.bmp
        - lambda: "id(wifi_setup) = false;"
        # First-boot setup screen (shown while Calendars is empty)
        - component.update: epaper
        - snapshot.take:
            id: epaper
            filename: setup-screen.bmp
        # The TRMNL font family (the Font select), with the demo events back in place
        - lambda: |-
            id(calendar_ids).publish_state("calendar.family, calendar.work");
        - select.set:
            id: font_family
            option: TRMNL
        - lambda: "id(view_days) = 1;"
        - component.update: epaper
        - snapshot.take:
            id: epaper
            filename: trmnl-day-view.bmp
        - lambda: "id(view_days) = 3;"
        - component.update: epaper
        - snapshot.take:
            id: epaper
            filename: trmnl-three-day-view.bmp
        - lambda: "id(view_days) = 1;"
        - select.set:
            id: font_family
            option: TRMNL
        # The setup screens in the TRMNL family
        - lambda: |-
            id(calendar_ids).publish_state("");
            id(wifi_setup) = true;
            id(wifi_qr).set_value("WIFI:T:nopass;S:" + id(ap_ssid) + ";;");
        - component.update: epaper
        - snapshot.take:
            id: epaper
            filename: trmnl-wifi-setup.bmp
        - lambda: "id(wifi_setup) = false;"
        - component.update: epaper
        - snapshot.take:
            id: epaper
            filename: trmnl-setup-screen.bmp
        - lambda: |-
            id(calendar_ids).publish_state("calendar.family, calendar.work");
        - lambda: "::exit(0);"

packages:
  common: !include common.yaml
  fonts: !include ../reterminal-e1001/fonts.yaml

display:
  - platform: snapshot
    id: epaper
    # reTerminal E1001 panel resolution
    dimensions: 800x480
    update_interval: never
    lambda: !include ../common/calendar-render.yaml
