# Seeed Studio reTerminal E1001 - battery powered calendar display
#
# Hardware only: the calendar itself (entities, fetch and sleep logic,
# render lambda and fonts) is the shared package in ../common, and this
# file plugs the reTerminal into its hooks.
#
# - Left / right buttons page backward / forward through the days.
# - Green button: short press cycles the view (day <-> 3-day), long
#   press (1s) jumps back to today.
# - Any of the three top buttons wakes it from deep sleep. The wake press
#   also performs its normal action (left/right page from today, green
#   cycles the view) - it beeps once the press registers. Green's
#   long-press (back to today) only works while awake; a wake always
#   starts on today anyway.
#
# This file is generic: it is the config an ESPHome dashboard adopts (the
# API encryption key is provisioned by Home Assistant on adoption, wifi
# comes from the fallback hotspot or your dashboard secrets). The
# prebuilt/web-installed image is built from reterminal-e1001.factory.yaml,
# which layers the installer extras (Improv Serial and Bluetooth
# provisioning, dashboard import, GitHub-release OTA updates) on top.
# For a personal build with fixed credentials, include this file as a
# package and add them on top - see the README for an example overlay.

packages:
  # The device-agnostic calendar logic, fonts included
  paper_calendar: !include ../common/paper-calendar.yaml

esp32:
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    # Needed for OTA with the 32MB flash this device ships with
    advanced:
      enable_idf_experimental_features: true

# The board's USB-C serial is a USB-UART bridge on UART0; the S3 default
# (USB_SERIAL_JTAG) is not wired out, so logs would go nowhere.
logger:
  hardware_uart: UART0

deep_sleep:
  # Any of the three top buttons wakes the device and performs its action
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      # Green button: cycle the view
      - pin:
          number: GPIO3
          allow_other_uses: true
          ignore_strapping_warning: true
        on_wake:
          - script.execute: wake_cycle_view
      # Right button: page forward
      - pin:
          number: GPIO4
          allow_other_uses: true
        on_wake:
          - script.execute: wake_page_forward
      # Left button: page back
      - pin:
          number: GPIO5
          allow_other_uses: true
        on_wake:
          - script.execute: wake_page_back

# ---- Device hooks called by the common package ----

script:
  # Press feedback on the buzzer
  - id: feedback_click
    then:
      - rtttl.play: "click:d=32,o=7,b=180:c"

  - id: feedback_home
    then:
      - rtttl.play: "home:d=16,o=7,b=180:c,e"

  - id: feedback_ok
    then:
      - rtttl.play: "ok:d=16,o=7,b=180:c,e,g"

  - id: feedback_error
    then:
      - rtttl.play: "err:d=8,o=5,b=120:c,c"

  # One battery reading per wake: power the divider, sample, power off.
  - id: read_battery
    mode: queued
    then:
      - output.turn_on: battery_meas_enable
      - delay: 20ms
      - component.update: battery_voltage
      - output.turn_off: battery_meas_enable

  # Nothing to latch before sleeping
  - id: before_deep_sleep
    then: []

binary_sensor:
  # Left button: page back
  - platform: gpio
    id: btn_left
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      - script.execute: action_page_back

  # Right button: page forward
  - platform: gpio
    id: btn_right
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      - script.execute: action_page_forward

  # Green button: short press cycles the view, 1s hold jumps back to today.
  - platform: gpio
    id: btn_green
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
      ignore_strapping_warning: true
    on_multi_click:
      - timing:
          - ON for at most 0.8s
          - OFF for at least 0.1s
        then:
          - script.execute: action_cycle_view
      - timing:
          - ON for at least 1s
        then:
          - script.execute: action_today

output:
  # Enables the battery voltage divider (per Seeed wiki)
  - platform: gpio
    id: battery_meas_enable
    pin: GPIO21
  - platform: ledc
    id: buzzer_out
    pin:
      number: GPIO45
      ignore_strapping_warning: true

rtttl:
  output: buzzer_out

sensor:
  - platform: adc
    id: battery_voltage
    name: Battery voltage
    pin: GPIO1
    attenuation: 12db
    # Read on demand by the read_battery script (once per wake); the
    # divider is only powered during the measurement.
    update_interval: never
    filters:
      - multiply: 2.0

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper
    # Pins (cs 10, dc 11, reset 12, busy 13) are the model defaults.
    model: seeed-reterminal-e1001
    # Fast partial refreshes while navigating; every 10th update is a full
    # refresh to clear ghosting.
    full_update_every: 10
    # Redrawn from the fetch script; never on a timer.
    update_interval: never
    # Shared with the host screenshot config - see common/calendar-render.yaml
    lambda: !include ../common/calendar-render.yaml
