# The calendar render lambda, shared between the real e-paper display and
# the host snapshot display that generates the README screenshots
# (screenshots/screenshots.yaml). Included with `lambda: !include`.
|-
  // The e-paper clears to white on its own; the explicit fill gives the
  // host snapshot display the same white background.
  it.fill(Color::WHITE);
  auto now = id(ha_time).now();
  const int width = it.get_width();
  const int height = it.get_height();
  const auto black = Color::BLACK;
  const bool use_12h = id(clock_12h).state;
  const bool wrap_titles = id(title_overflow).current_option().str() == "Word wrap";
  // Portrait (a device with an Orientation select): a single day with
  // larger text, on a narrow 540px-ish width
  const bool portrait = id(portrait_mode);
  auto fmt_time = [&](int hour, int minute) -> std::string {
    if (use_12h) {
      int h = hour % 12;
      if (h == 0)
        h = 12;
      return str_sprintf("%d:%02d%s", h, minute, hour < 12 ? "am" : "pm");
    }
    return str_sprintf("%02d:%02d", hour, minute);
  };
  // The Font select: TRMNL, or Terminus for anything else
  const bool trmnl = id(font_family).current_option() == "TRMNL";
  font::Font *f_header = trmnl ? id(trmnl_header) : id(font_header);
  font::Font *f_day = trmnl ? id(trmnl_day) : id(font_day);
  font::Font *f_event_big = trmnl ? id(trmnl_event_big) : id(font_event_big);
  font::Font *f_event = trmnl ? id(trmnl_event) : id(font_event);
  font::Font *f_small = trmnl ? id(trmnl_small) : id(font_small);
  // Portrait-only fonts: the ids come from the device's fonts.yaml preset
  // (only a portrait-capable device builds them)
  font::Font *f_header_xl = trmnl ? id(${trmnl_header_xl_id}) : id(${font_header_xl_id});
  font::Font *f_event_xl = trmnl ? id(${trmnl_event_xl_id}) : id(${font_event_xl_id});
  // The layout follows the fonts: every height and spacing below is
  // derived from these metrics, so a device can pick any font sizes (see
  // the fonts.yaml presets) and the display reflows to match.
  const int h_header = f_header->get_height();
  const int h_header_xl = f_header_xl->get_height();
  const int h_day = f_day->get_height();
  const int h_big = f_event_big->get_height();
  const int h_small = f_small->get_height();
  // Room kept clear at the bottom for the one-line footer hint, which is
  // drawn 4px above the edge
  const int footer_h = h_small + 10;
  ESP_LOGI("calendar", "render: %dx%d state=%d events=%u configured=%s",
           width, height, id(data_state), (unsigned) id(cal_starts).size(),
           YESNO(!id(calendar_ids).state.empty()));

  // Real pixel width of a string in a font - line budgets are measured,
  // not estimated from character counts
  auto text_w = [&](display::BaseFont *font, const std::string &t) -> int {
    int tx, ty, tw, th;
    it.get_text_bounds(0, 0, t.c_str(), font, TextAlign::TOP_LEFT, &tx, &ty, &tw, &th);
    return tw;
  };
  // Greedy word-wrap into at most max_lines lines that each fit within
  // budget pixels; the last line gets "~" if anything was cut off.
  // max_lines == 1 gives plain measured truncation.
  auto wrap_text = [&](display::BaseFont *font, const std::string &text, int budget,
                       int max_lines) -> std::vector<std::string> {
    std::vector<std::string> out;
    size_t pos = 0;
    while (pos < text.size() && (int) out.size() < max_lines) {
      while (pos < text.size() && text[pos] == ' ')
        pos++;
      if (pos >= text.size())
        break;
      std::string line;
      while (pos < text.size()) {
        size_t wstart = pos;
        while (wstart < text.size() && text[wstart] == ' ')
          wstart++;
        if (wstart >= text.size()) {
          pos = wstart;
          break;
        }
        size_t wend = text.find(' ', wstart);
        if (wend == std::string::npos)
          wend = text.size();
        const std::string word = text.substr(wstart, wend - wstart);
        if (line.empty()) {
          if (text_w(font, word) <= budget) {
            line = word;
            pos = wend;
          } else {
            // A single word wider than the column: take what fits,
            // never splitting a UTF-8 sequence
            size_t p = wstart;
            while (p < wend) {
              size_t clen = 1;
              while (p + clen < wend && (text[p + clen] & 0xC0) == 0x80)
                clen++;
              if (!line.empty() && text_w(font, line + text.substr(p, clen)) > budget)
                break;
              line += text.substr(p, clen);
              p += clen;
            }
            pos = p;
            break;
          }
        } else if (text_w(font, line + " " + word) <= budget) {
          line += " " + word;
          pos = wend;
        } else {
          break;
        }
      }
      if (pos < text.size() && (int) out.size() == max_lines - 1) {
        while (!line.empty() && text_w(font, line + "~") > budget) {
          size_t cut = line.size() - 1;
          while (cut > 0 && (line[cut] & 0xC0) == 0x80)
            cut--;
          line.resize(cut);
        }
        line += "~";
        pos = text.size();
      }
      out.push_back(std::move(line));
    }
    return out;
  };

  // Centred, word-wrapped paragraphs for the setup screens: each item
  // starts on a new line, wrapped lines are line_h apart and items are
  // item_gap further apart. Returns the y below the last line.
  auto print_items = [&](int y, display::BaseFont *font, int line_h, int item_gap,
                         std::initializer_list<const char *> items) -> int {
    for (const char *item : items) {
      for (const auto &line : wrap_text(font, item, width - 16, 4)) {
        it.print(width / 2, y, font, black, TextAlign::CENTER, line.c_str());
        y += line_h;
      }
      y += item_gap;
    }
    return y;
  };

  // ---- Wi-Fi setup screen (no credentials saved yet) ----
  if (id(wifi_setup)) {
    const int title_y = portrait ? height / 8 : height / 12;
    it.print(width / 2, title_y, f_header, black, TextAlign::CENTER, "Paper Calendar setup");
    // Landscape: one airy line per item. Portrait: items wrap, so tighter
    // lines with a gap between items.
    const int y = print_items(title_y + h_header + 26, f_event_big, portrait ? h_big + 8 : h_big * 9 / 5,
                              portrait ? h_big * 2 / 3 : 0,
                              {"Connect this device to Wi-Fi, using any of:",
                               "Bluetooth: set it up from Home Assistant",
                               "USB: open web.esphome.io in Chrome or Edge",
                               "Hotspot: scan below, then open 192.168.4.1"});
    // Join-the-hotspot QR code, centred; 5px modules stay readable for a
    // phone camera on e-paper. The page background is the quiet zone.
    const int qr_scale = 5;
    const int qr_px = id(wifi_qr).get_size() * qr_scale;
    const int qr_y = y - 10 + (portrait ? 40 : 0);
    it.qr_code((width - qr_px) / 2, qr_y, id(wifi_qr), black, qr_scale);
    it.printf(width / 2, qr_y + qr_px + 8, f_event, black, TextAlign::TOP_CENTER, "Wi-Fi: %s",
              id(ap_ssid).c_str());
    it.print(width / 2, height - 4, f_small, black, TextAlign::BOTTOM_CENTER,
             "The device stays awake until Wi-Fi is set up");
    return;
  }

  // ---- First-boot setup screen ----
  if (id(calendar_ids).state.empty()) {
    const int title_y = height * 7 / 32;
    it.print(width / 2, title_y, f_header, black, TextAlign::CENTER, "Paper Calendar setup");
    // Landscape: one airy line per step. Portrait: steps wrap, so tighter
    // lines with a gap between steps.
    const int y = print_items(title_y + h_header + 56, f_event_big, portrait ? h_big + 8 : h_big * 2,
                              portrait ? h_big * 3 / 4 : 0,
                              {"1. In Home Assistant, allow this device to perform actions",
                               "2. Fill in the Calendars text entity (e.g. calendar.family)",
                               "3. Pick a battery display style (optional)", "4. Press the Confirm setup button"});
    it.print(width / 2, y + h_small * 2, f_small, black, TextAlign::CENTER,
             "The device stays awake until setup is confirmed");
    return;
  }

  // Failed and nothing cached to fall back on
  if (id(data_state) == 2 && id(fetched_at) == 0) {
    it.print(width / 2, height / 2, f_header, black, TextAlign::CENTER, "Could not reach Home Assistant");
    return;
  }

  if (id(data_state) == 0 || !now.is_valid()) {
    it.print(width / 2, height / 2, f_header, black, TextAlign::CENTER, "Loading calendar...");
    return;
  }

  const int days = portrait ? 1 : id(view_days);
  const std::string today_key = now.strftime("%Y-%m-%d");
  const std::string now19 = now.strftime("%Y-%m-%d %H:%M:%S");
  const time_t base_ts = now.timestamp + (time_t) id(day_offset) * 86400;

  // ---- Header ----
  auto start_day = ESPTime::from_epoch_local(base_ts);
  auto end_day = ESPTime::from_epoch_local(base_ts + (time_t) (days - 1) * 86400);
  std::string title;
  if (portrait) {
    // Weekday on its own large line, the date below it
    title = (id(day_offset) == 0 ? "Today - " : "") + start_day.strftime("%d %B %Y");
  } else if (days == 1) {
    title = (id(day_offset) == 0 ? "Today - " : "") + start_day.strftime("%A %d %B");
  } else {
    title = start_day.strftime("%d %b") + " - " + end_day.strftime("%d %b %Y");
  }
  const int pad = 8;
  // The first header row is the title (portrait: the weekday) on the left
  // with the status on the right. Portrait then has the date line under
  // the large weekday. The last row is the "updated" / OFFLINE note, right
  // aligned under the taller of the lines above it (portrait: under the
  // date, which runs too wide to share a row with it).
  const int date_y = pad + h_header_xl;
  const int row2_y = portrait ? date_y + h_header : pad + std::max(h_header, h_day);
  if (portrait) {
    it.print(16, pad, f_header_xl, black, start_day.strftime("%A").c_str());
    it.print(16, date_y, f_header, black, title.c_str());
  } else {
    it.print(16, pad, f_header, black, title.c_str());
  }

  const char *view_label = days == 1 ? "Day" : (days == 3 ? "3-Day" : "Week");
  std::string batt;
  const std::string bmode = id(battery_display_mode).current_option().str();
  if (bmode == "Voltage") {
    batt = str_sprintf("%.2f V", id(battery_voltage).state);
  } else if (bmode == "Both") {
    batt = str_sprintf("%.0f%% (%.2f V)", id(battery_pct).state, id(battery_voltage).state);
  } else {
    batt = str_sprintf("%.0f%%", id(battery_pct).state);
  }
  // Room climate readout, e.g. "21.5 C 48% RH" with a degree sign. Empty
  // when the mode is Off, or with no reading (NAN: no sensor, or the read
  // failed).
  std::string climate;
  const std::string cmode = id(climate_display_mode).current_option().str();
  const float room_c = id(room_temperature);
  if (cmode != "Off" && !std::isnan(room_c)) {
    const bool fahrenheit = id(temperature_unit).current_option().str() == "Fahrenheit";
    // \u00B0 is the degree sign, kept escaped so this file stays ASCII
    climate = str_sprintf("%.1f\u00B0%c", fahrenheit ? room_c * 9.0f / 5.0f + 32.0f : room_c, fahrenheit ? 'F' : 'C');
    if (cmode == "Temperature and humidity" && !std::isnan(id(room_humidity)))
      climate += str_sprintf(" %.0f%% RH", id(room_humidity));
  }
  // Portrait has a single view, so no view label
  std::string status = portrait ? batt : std::string(view_label) + "   " + batt;
  // The climate readout leads the status line when it clears the title
  // on the left; otherwise it moves down beside "updated".
  const int title_right = 16 + (portrait ? text_w(f_header_xl, start_day.strftime("%A"))
                                         : text_w(f_header, title));
  bool climate_top = false;
  if (!climate.empty()) {
    const std::string with_climate = climate + "   " + status;
    if (width - 16 - text_w(f_day, with_climate) >= title_right + 24) {
      status = with_climate;
      climate_top = true;
    }
  }
  it.print(width - 16, pad, f_day, black, TextAlign::TOP_RIGHT, status.c_str());
  // When the events on screen were fetched, with the weekday if not today
  auto fetched = ESPTime::from_epoch_local(id(fetched_at));
  std::string fetched_text = fmt_time(fetched.hour, fetched.minute);
  if (fetched.strftime("%Y-%m-%d") != today_key)
    fetched_text = fetched.strftime("%a ") + fetched_text;
  // The climate readout, when it did not fit on the status line
  const std::string climate_low = climate.empty() || climate_top ? "" : climate + "   ";
  if (id(data_state) == 2) {
    // Offline: inverted, so it stands out from the normal stamp, with 2px
    // vertical padding, clear of the header rule.
    const std::string offline = "OFFLINE - data from " + fetched_text;
    int bx, by, bw, bh;
    it.get_text_bounds(width - 16, row2_y, offline.c_str(), f_small, TextAlign::TOP_RIGHT, &bx, &by, &bw, &bh);
    it.filled_rectangle(bx - 4, by - 2, bw + 8, bh + 4, black);
    it.print(width - 16, row2_y, f_small, Color::WHITE, TextAlign::TOP_RIGHT, offline.c_str());
    // The wider offline note leaves less room: drop the climate rather than
    // run it into the title
    if (!climate_low.empty() && bx - 4 - text_w(f_small, climate_low) >= title_right + 24)
      it.print(bx - 4, row2_y, f_small, black, TextAlign::TOP_RIGHT, climate_low.c_str());
  } else {
    it.print(width - 16, row2_y, f_small, black, TextAlign::TOP_RIGHT,
             (climate_low + "updated " + fetched_text).c_str());
  }
  // The header ends under its lowest line, plus a margin for the offline
  // note's padding
  const int header_h = row2_y + h_small + 8;
  it.line(0, header_h, width, header_h, black);

  // ---- Day columns ----
  const int top = header_h + (portrait ? 14 : 8);
  const int col_w = width / days;
  font::Font *ev_font = portrait ? f_event_xl : (days == 1 ? f_event_big : f_event);
  const int ev_h = ev_font->get_height();
  // One event line: the text height plus a third of it between lines
  const int row_h = ev_h + ev_h / 3;
  const int max_y = height - row_h - footer_h;
  for (int d = 0; d < days; d++) {
    const int x = d * col_w;
    auto day = ESPTime::from_epoch_local(base_ts + (time_t) d * 86400);
    std::string day_key = day.strftime("%Y-%m-%d");
    int y = top;
    if (days > 1) {
      it.printf(x + col_w / 2, y, f_day, black, TextAlign::TOP_CENTER, "%s", day.strftime("%a %d").c_str());
      y += h_day + 6;
      it.line(x + 6, y, x + col_w - 6, y, black);
      y += 6;
      if (d > 0)
        it.line(x, top, x, height - footer_h, black);
    }
    // Days outside the fetched range are unknown, not empty
    const bool in_range = id(cal_from).empty() || (day_key >= id(cal_from) && day_key < id(cal_to));
    int shown = 0, hidden = 0;
    for (size_t i = 0; in_range && i < id(cal_starts).size(); i++) {
      const std::string &s = id(cal_starts)[i];
      const std::string &e = id(cal_ends)[i];
      const bool all_day = s.size() == 10;
      // All-day events span [start, end) and can cover several days;
      // timed events are matched on their start date.
      const bool on_this_day = all_day ? (s <= day_key && day_key < e) : (s.compare(0, 10, day_key) == 0);
      if (!on_this_day)
        continue;
      if (y > max_y) {
        hidden++;
        continue;
      }
      std::string prefix, body;
      if (all_day) {
        prefix = "[";
        body = id(cal_titles)[i] + "]";
      } else {
        const int ev_hour = (s[11] - '0') * 10 + (s[12] - '0');
        const int ev_min = (s[14] - '0') * 10 + (s[15] - '0');
        prefix = fmt_time(ev_hour, ev_min) + " ";
        body = id(cal_titles)[i];
      }
      const int avail = col_w - 16;  // 8px margin each side
      const int prefix_w = text_w(ev_font, prefix);
      // Weekly view: the time gets its own line and the title starts on
      // the next line with a small indent
      const bool stack_time = !all_day && days == 7;
      const int indent = stack_time ? 12 : prefix_w;
      const int max_title_lines = wrap_titles ? (stack_time ? 2 : 3) : 1;
      auto title_lines = wrap_text(ev_font, body, avail - indent, max_title_lines);
      // In progress now (today's column only): a solid bar in the left
      // margin next to the first line. Same condition as the redraw hash.
      if (!all_day && day_key == today_key && s.compare(0, 19, now19) <= 0 && e.compare(0, 19, now19) > 0)
        it.filled_rectangle(x + 2, y + row_h / 8, 4, row_h - row_h / 4, black);
      if (stack_time) {
        it.print(x + 8, y, ev_font, black, prefix.c_str());
        y += row_h;
      }
      for (size_t li = 0; li < title_lines.size(); li++) {
        if (y > max_y)
          break;
        if (!stack_time && li == 0) {
          it.print(x + 8, y, ev_font, black, (prefix + title_lines[li]).c_str());
        } else {
          it.print(x + 8 + indent, y, ev_font, black, title_lines[li].c_str());
        }
        y += row_h;
      }
      shown++;
    }
    auto *note_font = portrait ? f_event_big : f_small;
    if (hidden > 0) {
      it.printf(x + 8, y, note_font, black, "+%d more", hidden);
    } else if (shown == 0) {
      if (in_range)
        it.print(x + 8, y, note_font, black, days == 1 ? "No events" : "-");
      else
        it.print(x + 8, y, note_font, black, days == 1 ? "Not available offline" : "?");
    }
  }

  // ---- Footer ----
  if (!id(setup_done)) {
    it.print(width / 2, height - 4, f_small, black, TextAlign::BOTTOM_CENTER,
             "Setup preview - press the Confirm setup button in HA to enable sleep");
  } else if (id(data_state) == 2) {
    it.print(width / 2, height - 4, f_small, black, TextAlign::BOTTOM_CENTER,
             "! Could not reach Home Assistant - showing last known events");
  } else if (portrait) {
    // Single-day view: the view button goes back to today
    it.print(width / 2, height - 4, f_small, black, TextAlign::BOTTOM_CENTER,
             "up: back    ${view_button}: today    down: forward");
  } else {
    it.print(width / 2, height - 4, f_small, black, TextAlign::BOTTOM_CENTER,
             "left: back    ${view_button}: change view (hold: today)    right: forward");
  }
